name: CI

# The developer gate: compile, lint and test the merged tree. It needs no artifact and no
# production secret, so it is safe to run on any checkout — including an untrusted one. The
# release-candidate gate (release-candidate.yml) is the one that touches a real installer.
#
# The other jobs are the trusted hosts that run what an untrusted Windows PC cannot, and none of
# them needs a signing key:
#   * `native-gate`  — Rust `cargo check`/`cargo test` for the desktop shell and the native host;
#   * `tor-runtime`  — the bundled Tor pin's provenance, then a real stage + run + package;
#   * `frontend-e2e` — Playwright against a real backend sidecar, with the real embedding model.
on:
  push:
    branches: ["integration/**", "fix/**", "release/**", "main"]
  pull_request:
  workflow_dispatch:

jobs:
  developer-gate:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # The suites print and assert UTF-8 (Russian UI strings), and several tests spawn a Python
      # child whose stdout/stderr is a pipe. Without UTF-8 mode the pipe is encoded with the host
      # codec (cp1252 on a Windows runner) and a child crashes with UnicodeEncodeError, which the
      # gate then reports as a test failure. One encoding, all the way down.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend and gateway dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.lock
          python -m pip install -r apps/gateway/requirements.txt "pytest>=8,<10" "ruff>=0.9,<1"
          python -m pip install cryptography

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Developer gate
        run: python scripts/release-gate.py developer

  native-gate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable

      - name: Provide the runtime/tor resource the Tauri build script requires
        shell: pwsh
        run: |
          # The compile/test gate ships no bundle, so — exactly like build.rs does for the sidecar —
          # it only needs the resource path to exist. The real pinned runtime is staged and run by
          # the dedicated `tor-runtime` job.
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/runtime/tor | Out-Null

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build the frontend (the Tauri build script expects a dist)
        working-directory: apps/desktop
        run: npx vite build

      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-targets

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

  tor-runtime:
    # The bundled Tor runtime, proven end to end: the pin's provenance (the Tor Project's signed
    # checksums + detached signature), a real verified download, and the staged daemon running on
    # its own. No GPU, no Pod, no signing key.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the pin against the Tor Project's signed checksums
        run: python scripts/verify-tor-runtime-pin.py

      - name: Fetch, verify and stage the pinned runtime
        run: python scripts/fetch-tor-runtime.py --print

      - name: The staged daemon runs on its own and reports the pinned version
        shell: pwsh
        run: |
          $exe = "apps/desktop/src-tauri/runtime/tor/tor.exe"
          if (-not (Test-Path $exe)) { throw "the daemon was not staged at $exe" }
          $output = (& $exe --version 2>&1 | Out-String)
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "tor --version exited $LASTEXITCODE" }
          if ($output -notmatch "0\.4\.9\.13") { throw "the staged daemon is not the pinned version" }

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.lock

      - name: The Tor bundling and service suites
        working-directory: apps/backend
        run: python -m pytest tests/test_tor_bundle.py tests/test_tor_service.py -q

  frontend-e2e:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.lock

      - name: Create the backend venv the Playwright webServer expects
        run: |
          python -m venv apps/backend/.venv
          apps/backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          apps/backend/.venv/Scripts/python.exe -m pip install -r apps/backend/requirements.lock
          apps/backend/.venv/Scripts/python.exe -m pip install -e apps/backend

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium

      # The real embedding model, pinned by revision and verified by hash. Cached by revision so a
      # repeat run does not re-download ~136 MB; the cache never masks a bad model because the
      # manager re-verifies every artifact by size and hash, and runs the embedding smoke, on load.
      - name: Restore the embedding model cache
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\Alex LLM\models\embeddings\multilingual-e5-small
          key: embedding-model-761b726dd34fb83930e26aab4e9ac3899aa1fa78

      - name: Provision the real embedding model (no GPU, no secret)
        run: python scripts/provision-embedding-model.py

      - name: Playwright
        working-directory: apps/desktop
        run: npm run test:e2e

  installer-build:
    # A TEST build: the full product assembled exactly as a release is — PyInstaller sidecar with
    # its stamp, the native host, the bundled Tor runtime, the baked Gateway URL and the NSIS
    # installer — but never signed with the production updater key and never published. The
    # production release gate is a separate, authorized action on a trusted host.
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable

      - name: Create the backend venv the sidecar build uses
        run: |
          python -m venv apps/backend/.venv
          apps/backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          apps/backend/.venv/Scripts/python.exe -m pip install -r apps/backend/requirements.lock

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build the test installer (no production signing)
        shell: pwsh
        run: ./scripts/build-desktop.ps1 -TestBuild

      - name: The production release gate must refuse an unsigned test build
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter *setup.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          python scripts/release-gate.py verify-artifact --installer $installer.FullName --version 1.2.0
          if ($LASTEXITCODE -eq 0) {
            throw "the production release gate accepted an unsigned test build — it must not"
          }
          Write-Host "the release gate correctly refused the unsigned test build (exit $LASTEXITCODE)"

      - name: Upload the test installer
        uses: actions/upload-artifact@v4
        with:
          name: canalla-test-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*setup.exe
          if-no-files-found: error

      - name: Install it silently and check what the bundle laid down
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter *setup.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          $root = $null
          $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            Get-ItemProperty | Where-Object { $_.DisplayName -like '*Canalla*' } | Select-Object -First 1
          if ($entry -and $entry.InstallLocation -and (Test-Path $entry.InstallLocation)) {
            $root = $entry.InstallLocation
          }
          if (-not $root) {
            $exe = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter alex-llm.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($exe) { $root = $exe.Directory.FullName }
          }
          if (-not $root) { throw "the installed client was not found" }
          Write-Host "installed to $root"
          $client = Join-Path $root 'alex-llm.exe'
          $sidecar = Join-Path $root 'sidecar\alex-backend\alex-backend.exe'
          $tor = Join-Path $root 'runtime\tor\tor.exe'
          foreach ($path in @($client, $sidecar, $tor)) {
            if (-not (Test-Path $path)) { throw "missing from the installed tree: $path" }
            Write-Host ("{0}  {1} bytes" -f $path, (Get-Item $path).Length)
          }
          python scripts/verify-packaged-gateway-url.py $client
          "root=$root" | Out-File -FilePath $env:RUNNER_TEMP/installed-root.txt -Encoding ascii

      - name: The installed sidecar answers /health on its own
        shell: pwsh
        run: |
          $root = (Get-Content $env:RUNNER_TEMP/installed-root.txt).Trim() -replace '^root=', ''
          $sidecar = Join-Path $root 'sidecar\alex-backend\alex-backend.exe'
          $data = Join-Path $env:RUNNER_TEMP 'canalla-install-smoke'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $env:ALEX_LLM_DATA_DIR = $data
          $env:ALEX_BACKEND_HOST = '127.0.0.1'
          $env:ALEX_BACKEND_PORT = '8137'
          $env:APP_ENV = 'test'
          $env:LLM_PROVIDER = 'mock'
          $env:JWT_SECRET = 'install-smoke-not-a-real-secret-' + ('a' * 24)
          $process = Start-Process -FilePath $sidecar -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8137/health' -TimeoutSec 3
                if ($health.product -eq 'alex-llm') { $ok = $true; Write-Host ($health | ConvertTo-Json -Compress); break }
              } catch {}
              if ($process.HasExited) { break }
            }
            if (-not $ok) { throw "the installed sidecar did not answer /health (exited=$($process.HasExited))" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
