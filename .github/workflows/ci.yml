name: CI

# The developer gate: compile, lint and test the merged tree. It needs no artifact and no
# production secret, so it is safe to run on any checkout — including an untrusted one. The
# release-candidate gate (release-candidate.yml) is the one that touches a real installer.
#
# The other jobs are the trusted hosts that run what an untrusted Windows PC cannot, and none of
# them needs a signing key:
#   * `native-gate`  — Rust `cargo check`/`cargo test` for the desktop shell and the native host;
#   * `tor-runtime`  — the bundled Tor pin's provenance, then a real stage + run + package;
#   * `frontend-e2e` — Playwright against a real backend sidecar, with the real embedding model.
on:
  push:
    branches: ["integration/**", "fix/**", "release/**", "main"]
  pull_request:
  workflow_dispatch:

jobs:
  developer-gate:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # The suites print and assert UTF-8 (Russian UI strings), and several tests spawn a Python
      # child whose stdout/stderr is a pipe. Without UTF-8 mode the pipe is encoded with the host
      # codec (cp1252 on a Windows runner) and a child crashes with UnicodeEncodeError, which the
      # gate then reports as a test failure. One encoding, all the way down.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend and gateway dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.lock
          python -m pip install -r apps/gateway/requirements.txt "pytest>=8,<10" "ruff>=0.9,<1"
          python -m pip install cryptography

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Developer gate
        run: python scripts/release-gate.py developer

  native-gate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable

      - name: Provide the runtime/tor resource the Tauri build script requires
        shell: pwsh
        run: |
          # The compile/test gate ships no bundle, so — exactly like build.rs does for the sidecar —
          # it only needs the resource path to exist. The real pinned runtime is staged and run by
          # the dedicated `tor-runtime` job.
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/runtime/tor | Out-Null

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build the frontend (the Tauri build script expects a dist)
        working-directory: apps/desktop
        run: npx vite build

      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-targets

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

  tor-runtime:
    # The bundled Tor runtime, proven end to end: the pin's provenance (the Tor Project's signed
    # checksums + detached signature), a real verified download, and the staged daemon running on
    # its own. No GPU, no Pod, no signing key.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the pin against the Tor Project's signed checksums
        run: python scripts/verify-tor-runtime-pin.py

      # Keyed by the pinned version, so once a run has restored the archives this job no longer needs
      # dist.torproject.org or gnu.org at all. A cache hit is re-verified against the pin by the
      # script — the cache can only save bandwidth, never change what is staged.
      - name: Restore the verified Tor archives
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.tor-runtime-cache
          key: tor-runtime-15.0.25

      - name: Fetch, verify and stage the pinned runtime
        run: python scripts/fetch-tor-runtime.py --print --cache "${{ github.workspace }}/.tor-runtime-cache"

      - name: The staged daemon runs on its own and reports the pinned version
        shell: pwsh
        run: |
          $exe = "apps/desktop/src-tauri/runtime/tor/tor.exe"
          if (-not (Test-Path $exe)) { throw "the daemon was not staged at $exe" }
          $output = (& $exe --version 2>&1 | Out-String)
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "tor --version exited $LASTEXITCODE" }
          if ($output -notmatch "0\.4\.9\.14") { throw "the staged daemon is not the pinned version" }

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.lock

      - name: The Tor bundling and service suites
        working-directory: apps/backend
        run: python -m pytest tests/test_tor_bundle.py tests/test_tor_service.py -q

  llama-runtime:
    # The reserve region's CUDA runtime, proven from the official release instead of copied from an
    # unreachable binary: the pin is re-read from the repository's own Releases API, both archives
    # are downloaded and verified by size and SHA256, and the staged launcher answers --version and
    # advertises every flag the launch contract needs — on a host with no GPU. No Pod, no signing
    # key, no production secret.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the pin against the official release
        run: python scripts/verify-llama-runtime-pin.py

      - name: Download, verify and stage the pinned runtime
        run: python scripts/provision-llama-runtime.py --dest "$RUNNER_TEMP/llama-bin" --print

      - name: The staged launcher answers --version and --help on its own
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/llama-bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$RUNNER_TEMP/llama-bin/llama-server" --version
          "$RUNNER_TEMP/llama-bin/llama-server" --help | grep -E -- '--flash-attn|--n-gpu-layers|--ctx-size|--jinja' >/dev/null
          echo "llama-server answered --version and --help with no GPU"

      # The same command a CPU Pod runs to put the runtime on the reserve volume, proven on Linux
      # (the Pod is Linux; a Windows host cannot create the archive's dangling symlinks). It walks
      # the download path, not the cache, because that is what a fresh Pod does.
      - name: The Pod's own shell command stages and runs the runtime
        shell: bash
        run: |
          python scripts/provision-llama-runtime.py --pod-command --pod-verify --pod-dest "$RUNNER_TEMP/pod-dest" > "$RUNNER_TEMP/podcmd.sh"
          bash "$RUNNER_TEMP/podcmd.sh" 2>&1 | tee "$RUNNER_TEMP/podcmd.log"
          grep -q CANALLA_L_OK "$RUNNER_TEMP/podcmd.log"
          grep -q CANALLA_L_EXEC_OK "$RUNNER_TEMP/podcmd.log"
          grep -q "CANALLA_L_SERVER_SHA256 860ae1b8" "$RUNNER_TEMP/podcmd.log"
          grep -q "build 11565" "$RUNNER_TEMP/podcmd.log"
          echo "the Pod command staged and ran the pinned runtime"

      - name: Upload the runtime manifest
        uses: actions/upload-artifact@v4
        with:
          name: llama-runtime-manifest
          path: ${{ runner.temp }}/llama-bin/llama-runtime-manifest.json
          if-no-files-found: error

  llama-runtime-image:
    # Does the image the GPU Pod actually runs satisfy the pinned build? A bare Ubuntu lacked
    # libgomp.so.1, so this is answered inside the *production* image instead of inferred: the
    # pinned runtime is staged, the multi-gigabyte image is pulled and scripts/probe-runtime-in-image.sh
    # runs in it and fails loudly on any missing dependency except the driver library a real GPU
    # supplies. No Pod, no GPU, no signing key, no secret.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PROD_IMAGE: runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Free disk space for a multi-gigabyte image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /

      - name: Verify the pin against the official release
        run: python scripts/verify-llama-runtime-pin.py

      - name: Download, verify and stage the pinned runtime
        run: python scripts/provision-llama-runtime.py --dest "$RUNNER_TEMP/llama-bin"

      - name: Pull the production Pod image
        run: docker pull "$PROD_IMAGE"

      - name: Probe the runtime inside the production image
        shell: bash
        run: |
          docker run --rm --entrypoint sh -e RUNTIME=/runtime \
            -v "$RUNNER_TEMP/llama-bin:/runtime:ro" \
            -v "$PWD/scripts/probe-runtime-in-image.sh:/probe.sh:ro" \
            "$PROD_IMAGE" /probe.sh

  frontend-e2e:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      # The real embedding model is provisioned into a workspace-relative data root and the e2e
      # backend is pointed at it, so the cache path is stable across runs.
      ALEX_LLM_DATA_DIR: ${{ github.workspace }}/.embedding-model
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.lock

      - name: Create the backend venv the Playwright webServer expects
        run: |
          python -m venv apps/backend/.venv
          apps/backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          apps/backend/.venv/Scripts/python.exe -m pip install -r apps/backend/requirements.lock
          apps/backend/.venv/Scripts/python.exe -m pip install -e apps/backend

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium

      # The real embedding model, pinned by revision and verified by hash. Cached by revision so a
      # repeat run does not re-download ~136 MB; the cache never masks a bad model because the
      # manager re-verifies every artifact by size and hash, and runs the embedding smoke, on load.
      - name: Restore the embedding model cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.embedding-model/models/embeddings/multilingual-e5-small
          key: embedding-model-761b726dd34fb83930e26aab4e9ac3899aa1fa78

      - name: Provision the real embedding model (no GPU, no secret)
        run: python scripts/provision-embedding-model.py

      - name: Playwright
        working-directory: apps/desktop
        run: npm run test:e2e

  installer-build:
    # A TEST build: the full product assembled exactly as a release is — PyInstaller sidecar with
    # its stamp, the native host, the bundled Tor runtime, the baked Gateway URL and the NSIS
    # installer — but never signed with the production updater key and never published. The
    # production release gate is a separate, authorized action on a trusted host.
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      # The archives the tor-runtime job verified, restored from the same cache, so the installer
      # build does not depend on an external host at all once the cache is warm.
      TOR_RUNTIME_CACHE: ${{ github.workspace }}/.tor-runtime-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable

      - name: Restore the verified Tor archives
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.tor-runtime-cache
          key: tor-runtime-15.0.25

      - name: Create the backend venv the sidecar build uses
        run: |
          python -m venv apps/backend/.venv
          apps/backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          apps/backend/.venv/Scripts/python.exe -m pip install -r apps/backend/requirements.lock

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build the test installer (no production signing)
        shell: pwsh
        run: ./scripts/build-desktop.ps1 -TestBuild

      - name: The production release gate must refuse an unsigned test build
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter *setup.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          python scripts/release-gate.py verify-artifact --installer $installer.FullName --version 1.2.1
          if ($LASTEXITCODE -eq 0) {
            throw "the production release gate accepted an unsigned test build — it must not"
          }
          Write-Host "the release gate correctly refused the unsigned test build (exit $LASTEXITCODE)"
          exit 0

      - name: Upload the test installer
        uses: actions/upload-artifact@v4
        with:
          name: canalla-test-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*setup.exe
          if-no-files-found: error

      - name: Install it silently and check what the bundle laid down
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter *setup.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          # The NSIS hook pins the programme dir: %LOCALAPPDATA%\Programs\Canalla LLM.
          $root = Join-Path $env:LOCALAPPDATA 'Programs\Canalla LLM'
          if (-not (Test-Path $root)) {
            $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
              Get-ItemProperty | Where-Object { $_.DisplayName -like '*Canalla*' } | Select-Object -First 1
            if ($entry -and $entry.InstallLocation -and (Test-Path $entry.InstallLocation)) {
              $root = $entry.InstallLocation
            }
          }
          if (-not (Test-Path $root)) { throw "the installed client was not found (expected $root)" }
          Write-Host "installed to $root"
          $client = Join-Path $root 'alex-llm.exe'
          $sidecar = Join-Path $root 'sidecar\alex-backend\alex-backend.exe'
          $tor = Join-Path $root 'runtime\tor\tor.exe'
          # The hashes of the binaries a Defender investigation has to compare against a local
          # detection, so an artifact can be named by hash instead of by size alone.
          foreach ($path in @($client, $sidecar, $tor)) {
            if (-not (Test-Path $path)) { throw "missing from the installed tree: $path" }
            Write-Host ("{0}  {1} bytes  sha256={2}" -f $path, (Get-Item $path).Length, (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant())
          }
          # The host loop is one of the files a Defender investigation flagged; record its hash where
          # it actually is, without making the build depend on that exact location.
          $hostLoop = @((Join-Path $root 'sidecar\alex-host-loop.exe'), (Join-Path $root 'alex-host-loop.exe')) |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($hostLoop) {
            Write-Host ("{0}  {1} bytes  sha256={2}" -f $hostLoop, (Get-Item $hostLoop).Length, (Get-FileHash $hostLoop -Algorithm SHA256).Hash.ToLowerInvariant())
          } else {
            Write-Host 'host loop not found at the expected paths'
          }
          python scripts/verify-packaged-gateway-url.py $client
          if ($LASTEXITCODE -ne 0) { throw "the installed client does not carry the production Gateway URL" }
          "root=$root" | Out-File -FilePath $env:RUNNER_TEMP/installed-root.txt -Encoding ascii
          exit 0

      - name: The installed sidecar answers /health on its own
        shell: pwsh
        run: |
          $root = (Get-Content $env:RUNNER_TEMP/installed-root.txt).Trim() -replace '^root=', ''
          $sidecar = Join-Path $root 'sidecar\alex-backend\alex-backend.exe'
          $data = Join-Path $env:RUNNER_TEMP 'canalla-install-smoke'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $env:ALEX_LLM_DATA_DIR = $data
          $env:ALEX_BACKEND_HOST = '127.0.0.1'
          $env:ALEX_BACKEND_PORT = '8137'
          $env:APP_ENV = 'test'
          $env:LLM_PROVIDER = 'mock'
          $env:JWT_SECRET = 'install-smoke-not-a-real-secret-' + ('a' * 24)
          $process = Start-Process -FilePath $sidecar -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8137/health' -TimeoutSec 3
                if ($health.product -eq 'alex-llm') { $ok = $true; Write-Host ($health | ConvertTo-Json -Compress); break }
              } catch {}
              if ($process.HasExited) { break }
            }
            if (-not $ok) { throw "the installed sidecar did not answer /health (exited=$($process.HasExited))" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          exit 0

      # An upgrade is a replacement, not a merge. Tauri installs the new tree over the old one, so a
      # stale file from the previous build survives unless the installer removes it. This is not
      # hypothetical: 1.2.0 on a real machine carried a half-collected _internal\cryptography, and
      # 1.2.1 installed over it made `cryptography` a namespace package, which killed the sidecar
      # before /health. Plant exactly that file and prove the second install removes it.
      - name: An upgrade replaces the previous sidecar tree instead of merging with it
        shell: pwsh
        run: |
          $root = (Get-Content $env:RUNNER_TEMP/installed-root.txt).Trim() -replace '^root=', ''
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter *setup.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $stale = Join-Path $root 'sidecar\alex-backend\_internal\cryptography\hazmat\bindings\_rust.pyd'
          New-Item -ItemType Directory -Force -Path (Split-Path $stale) | Out-Null
          Set-Content -Path $stale -Value 'stale placeholder'
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $stale) { throw "the upgrade kept a stale file from the previous sidecar tree: $stale" }
          Write-Host 'the upgrade removed the stale sidecar file'

          $sidecar = Join-Path $root 'sidecar\alex-backend\alex-backend.exe'
          $data = Join-Path $env:RUNNER_TEMP 'canalla-upgrade-smoke'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $env:ALEX_LLM_DATA_DIR = $data
          $env:ALEX_BACKEND_HOST = '127.0.0.1'
          $env:ALEX_BACKEND_PORT = '8138'
          $env:APP_ENV = 'test'
          $env:LLM_PROVIDER = 'mock'
          $env:JWT_SECRET = 'upgrade-smoke-not-a-real-secret-' + ('b' * 24)
          $process = Start-Process -FilePath $sidecar -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8138/health' -TimeoutSec 3
                if ($health.product -eq 'alex-llm') { $ok = $true; Write-Host ($health | ConvertTo-Json -Compress); break }
              } catch {}
              if ($process.HasExited) { break }
            }
            if (-not $ok) { throw "the upgraded sidecar did not answer /health (exited=$($process.HasExited))" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          exit 0

      # The four binaries a Defender investigation has to reason about, taken from the *installed*
      # tree rather than from the outer NSIS file: hash, provenance and the protection's own verdict.
      # A scan that finds nothing is recorded as an observation with engine and signature versions —
      # never as proof that a file is safe.
      - name: Security record of the installed binaries
        shell: pwsh
        run: |
          $root = (Get-Content $env:RUNNER_TEMP/installed-root.txt).Trim() -replace '^root=', ''
          $files = @(
            (Join-Path $root 'alex-llm.exe'),
            (Join-Path $root 'sidecar\alex-host-loop.exe'),
            (Join-Path $root 'sidecar\alex-backend\alex-backend.exe'),
            (Join-Path $root 'runtime\tor\tor.exe')
          )
          $record = [ordered]@{ recorded_at = (Get-Date).ToUniversalTime().ToString('o'); files = @() }
          try {
            $mp = Get-MpComputerStatus
            $record['defender'] = [ordered]@{
              realtime = $mp.RealTimeProtectionEnabled
              engine = $mp.AMEngineVersion
              signatures = $mp.AntivirusSignatureVersion
              signature_age_days = $mp.AntivirusSignatureAge
            }
          } catch {
            $record['defender'] = [ordered]@{ error = $_.Exception.Message }
          }
          foreach ($path in $files) {
            if (-not (Test-Path $path)) {
              $record.files += [ordered]@{ path = $path; present = $false }
              continue
            }
            $entry = [ordered]@{
              path = $path
              present = $true
              bytes = (Get-Item $path).Length
              sha256 = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            try {
              $before = (Get-MpThreatDetection | Measure-Object).Count
              Start-MpScan -ScanType CustomScan -ScanPath $path -ErrorAction Stop | Out-Null
              $entry['scan'] = 'completed'
              $entry['new_detections'] = ((Get-MpThreatDetection | Measure-Object).Count - $before)
            } catch {
              $entry['scan'] = 'unavailable'
              $entry['scan_error'] = $_.Exception.Message
            }
            $record.files += $entry
          }
          $stamp = Join-Path $root 'sidecar\alex-backend\build-stamp.json'
          if (Test-Path $stamp) { $record['sidecar_stamp'] = Get-Content $stamp -Raw | ConvertFrom-Json }
          $tor = Join-Path $root 'runtime\tor\runtime.json'
          if (Test-Path $tor) { $record['tor_runtime'] = Get-Content $tor -Raw | ConvertFrom-Json }
          $out = Join-Path $env:RUNNER_TEMP 'windows-binary-security-record.json'
          $record | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 $out
          Get-Content $out
          exit 0

      - name: Upload the security record
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary-security-record
          path: ${{ runner.temp }}/windows-binary-security-record.json
          if-no-files-found: error
