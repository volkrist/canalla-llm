name: CI

# The developer gate: compile, lint and test the merged tree. It needs no artifact and no
# production secret, so it is safe to run on any checkout — including an untrusted one. The
# release-candidate gate (release-candidate.yml) is the one that touches a real installer.
#
# The other jobs are the trusted hosts that run what an untrusted Windows PC cannot, and none of
# them needs a signing key:
#   * `native-gate`  — Rust `cargo check`/`cargo test` for the desktop shell and the native host;
#   * `tor-runtime`  — the bundled Tor pin's provenance, then a real stage + run + package;
#   * `frontend-e2e` — Playwright against a real backend sidecar, with the real embedding model.
on:
  push:
    branches: ["integration/**", "fix/**", "release/**", "main"]
  pull_request:
  workflow_dispatch:

jobs:
  developer-gate:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # The suites print and assert UTF-8 (Russian UI strings), and several tests spawn a Python
      # child whose stdout/stderr is a pipe. Without UTF-8 mode the pipe is encoded with the host
      # codec (cp1252 on a Windows runner) and a child crashes with UnicodeEncodeError, which the
      # gate then reports as a test failure. One encoding, all the way down.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend and gateway dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.lock
          python -m pip install -r apps/gateway/requirements.txt "pytest>=8,<10" "ruff>=0.9,<1"
          python -m pip install cryptography

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Developer gate
        run: python scripts/release-gate.py developer

  native-gate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable

      - name: Provide the runtime/tor resource the Tauri build script requires
        shell: pwsh
        run: |
          # The compile/test gate ships no bundle, so — exactly like build.rs does for the sidecar —
          # it only needs the resource path to exist. The real pinned runtime is staged and run by
          # the dedicated `tor-runtime` job.
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/runtime/tor | Out-Null

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build the frontend (the Tauri build script expects a dist)
        working-directory: apps/desktop
        run: npx vite build

      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-targets

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

  tor-runtime:
    # The bundled Tor runtime, proven end to end: the pin's provenance (the Tor Project's signed
    # checksums + detached signature), a real verified download, and the staged daemon running on
    # its own. No GPU, no Pod, no signing key.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the pin against the Tor Project's signed checksums
        run: python scripts/verify-tor-runtime-pin.py

      - name: Fetch, verify and stage the pinned runtime
        run: python scripts/fetch-tor-runtime.py --print

      - name: The staged daemon runs on its own and reports the pinned version
        shell: pwsh
        run: |
          $exe = "apps/desktop/src-tauri/runtime/tor/tor.exe"
          if (-not (Test-Path $exe)) { throw "the daemon was not staged at $exe" }
          $output = (& $exe --version 2>&1 | Out-String)
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "tor --version exited $LASTEXITCODE" }
          if ($output -notmatch "0\.4\.9\.13") { throw "the staged daemon is not the pinned version" }

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.lock

      - name: The Tor bundling and service suites
        working-directory: apps/backend
        run: python -m pytest tests/test_tor_bundle.py tests/test_tor_service.py -q

  frontend-e2e:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.lock

      - name: Create the backend venv the Playwright webServer expects
        run: |
          python -m venv apps/backend/.venv
          apps/backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          apps/backend/.venv/Scripts/python.exe -m pip install -r apps/backend/requirements.lock
          apps/backend/.venv/Scripts/python.exe -m pip install -e apps/backend

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium

      # The real embedding model, pinned by revision and verified by hash. Cached by revision so a
      # repeat run does not re-download ~136 MB; the cache never masks a bad model because the
      # manager re-verifies every artifact by size and hash, and runs the embedding smoke, on load.
      - name: Restore the embedding model cache
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\Alex LLM\models\embeddings\multilingual-e5-small
          key: embedding-model-761b726dd34fb83930e26aab4e9ac3899aa1fa78

      - name: Provision the real embedding model (no GPU, no secret)
        run: python scripts/provision-embedding-model.py

      - name: Playwright
        working-directory: apps/desktop
        run: npm run test:e2e
