name: CI

# The developer gate: compile, lint and test the merged tree. It needs no artifact and no
# production secret, so it is safe to run on any checkout — including an untrusted one. The
# release-candidate gate (release-candidate.yml) is the one that touches a real installer.
#
# `native-gate` is the trusted host that finally runs what an untrusted Windows PC cannot: the
# Rust `cargo check`/`cargo test` for the desktop shell and the native host. `frontend-e2e` runs
# the Playwright suites against a real backend sidecar. Neither job needs a signing key, so both
# are safe on GitHub-hosted runners.
on:
  push:
    branches: ["integration/**", "fix/**", "release/**", "main"]
  pull_request:
  workflow_dispatch:

jobs:
  developer-gate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend and gateway dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.lock
          python -m pip install -r apps/gateway/requirements.txt "pytest>=8,<10" "ruff>=0.9,<1"
          python -m pip install cryptography

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Developer gate
        run: python scripts/release-gate.py developer

  native-gate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable

      - name: Provide the runtime/tor resource the Tauri build script requires
        shell: pwsh
        run: |
          # The compile/test gate ships no bundle, so — exactly like build.rs does for the sidecar —
          # it only needs the resource path to exist. A release build stages the real pinned runtime
          # with scripts/fetch-tor-runtime.py; that pin is an operator/supply-chain concern and is
          # NOT downloaded here.
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/runtime/tor | Out-Null

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build the frontend (the Tauri build script expects a dist)
        working-directory: apps/desktop
        run: npx vite build

      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-targets

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

  frontend-e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.lock

      - name: Create the backend venv the Playwright webServer expects
        run: |
          python -m venv apps/backend/.venv
          apps/backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          apps/backend/.venv/Scripts/python.exe -m pip install -r apps/backend/requirements.lock
          apps/backend/.venv/Scripts/python.exe -m pip install -e apps/backend

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: apps/desktop
        run: npm run test:e2e
