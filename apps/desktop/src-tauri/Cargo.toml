[package]
name = "alex-llm"
version = "1.2.0"
description = "Alex LLM desktop client"
edition = "2021"
default-run = "alex-llm"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
# Signed, verified updates: the plugin checks every downloaded package against the public key in
# tauri.conf.json before it may run the installer.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# One product per machine: a second launch focuses the running window instead of starting a second
# desktop with its own backend, native host and Tor.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
sha2 = "0.10"

# The platform implementations live behind one contract in `src/platform`; only the platform that
# is actually being built pulls its own toolkit in.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[target.'cfg(unix)'.dependencies]
# Process groups, the parent-death signal and `statvfs`: the POSIX half of the same contract.
libc = "0.2"

[[bin]]
name = "alex-llm"
path = "src/main.rs"

[[bin]]
name = "alex-host-loop"
path = "src/bin/alex_host_loop.rs"

[dev-dependencies]
# The release gate verifies a real package signature with the same crates the updater plugin uses,
# so "the key in the client accepts this artifact and refuses a tampered one" is a proven fact.
base64 = "0.22"
minisign-verify = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
