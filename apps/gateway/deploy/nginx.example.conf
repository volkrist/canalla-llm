# Central Alex Gateway — reverse proxy + TLS (EXAMPLE ONLY).
#
# Nothing in this repository installs, deploys or reloads this file, and no certificate or DNS
# record exists because of it. Treat it as a reviewed starting point.
#
# Install it as (paths are the Debian/Ubuntu convention; adapt for your distribution):
#   install -m 644 nginx.example.conf /etc/nginx/sites-available/alex-gateway.conf
#   ln -s /etc/nginx/sites-available/alex-gateway.conf /etc/nginx/sites-enabled/alex-gateway.conf
#   nginx -t && systemctl reload nginx
#
# Why TLS is not optional: the desktop client REFUSES plaintext HTTP unless the host is
# loopback, and enrollment carries a one-time activation code plus the installation secret.
# The Gateway itself listens on plaintext HTTP on 127.0.0.1:9000 (loopback/private only) and
# must never be reachable directly from the internet.
#
# The `limit_req_zone` and `upstream` directives below are HTTP-context directives: they are
# valid because `sites-enabled/*` is included from inside the `http {}` block.
#
# Rate limiting: /enroll is the only unauthenticated write path (it accepts a one-time
# activation code), so it is limited at the proxy IN ADDITION to the Gateway's own
# ENROLLMENT_RATE_LIMIT sliding window. The proxy limit is per client IP; the Gateway limit is
# per key. They are independent on purpose — the proxy limit survives a Gateway restart, and
# the Gateway limit survives a proxy misconfiguration.

limit_req_zone $binary_remote_addr zone=alex_enroll:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=alex_api:10m    rate=300r/m;
limit_req_status 429;

upstream alex_gateway {
    # The Gateway is a single uvicorn process on loopback.
    server 127.0.0.1:9000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# HTTP: ACME http-01 challenge, then a permanent redirect. Never serve the API in the clear.
server {
    listen 80;
    listen [::]:80;
    server_name gateway.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name gateway.example.com;

    # Certificate issued by your ACME client. Automatic renewal is NOT configured here: verify
    # that the renewal timer runs, and alert on expiry (docs/gateway-deployment.md).
    ssl_certificate     /etc/letsencrypt/live/gateway.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Enable HSTS only after the certificate and its renewal path are proven, because it locks
    # clients onto HTTPS for max-age.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    server_tokens off;

    # Control-plane JSON and chat text only: no uploads pass through the Gateway.
    client_max_body_size 2m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # `combined` logs method, path, status and request id — never headers and never bodies, so
    # Authorization tokens and prompts cannot leak into the proxy log.
    access_log /var/log/nginx/alex-gateway.access.log combined;
    error_log  /var/log/nginx/alex-gateway.error.log warn;

    # Shared proxy headers. The Gateway is reached only over loopback, so forwarded values
    # cannot be forged by a remote client. X-Request-Id is nginx's own id and lets an audit
    # row be correlated with a proxy log line.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;

    # Unauthenticated enrollment: throttled and not retried on failure.
    location = /enroll {
        limit_req zone=alex_enroll burst=5 nodelay;
        proxy_pass http://alex_gateway;
        proxy_next_upstream off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # Liveness/readiness probe. Public, secret-free, cheap; kept out of the rate limits so
    # monitoring is never throttled, and out of the access log so it does not drown it.
    location = /health {
        access_log off;
        proxy_pass http://alex_gateway;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Token, compute, balance and model traffic. /v1/chat/completions is Server-Sent Events:
    # response buffering would delay tokens until the stream ends, and `proxy_read_timeout`
    # must outlive the longest generation (INFERENCE_TIMEOUT_SECONDS = 900s by default).
    location /v1/ {
        limit_req zone=alex_api burst=60 nodelay;
        proxy_pass http://alex_gateway;
        proxy_buffering off;           # stream SSE frames immediately
        proxy_cache off;
        proxy_request_buffering off;   # forward the prompt body without waiting for the full upload
        gzip off;                      # keep SSE frame boundaries intact
        chunked_transfer_encoding on;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;       # matches INFERENCE_TIMEOUT_SECONDS
        proxy_read_timeout 900s;       # matches INFERENCE_TIMEOUT_SECONDS
    }

    location / {
        limit_req zone=alex_api burst=60 nodelay;
        proxy_pass http://alex_gateway;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
