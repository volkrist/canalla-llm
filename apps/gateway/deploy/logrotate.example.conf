# Central Alex Gateway — log rotation (EXAMPLE ONLY).
#
# ============================ LOGS MUST NEVER CONTAIN CREDENTIALS ============================
# The Gateway redacts secrets itself (the RunPod master key, the JWT signing key, installation
# secrets, Authorization headers and connection strings are not logged), and it never logs
# prompts or completions. Operators must not weaken that: do not add request/response body
# logging, do not dump the environment at startup, and do not lower the log level to a debug
# mode that prints headers. If a credential ever appears in a log, treat it as leaked and
# rotate it (JWT_SECRET is cheap to rotate; RUNPOD_API_KEY is not).
# ============================================================================================
#
# WHICH PATH APPLIES TO YOU
#
# 1) systemd + journald (recommended, and the example unit in docs/gateway-deployment.md uses
#    it): uvicorn writes to stdout/stderr and journald owns the files. There is nothing for
#    logrotate to do — cap and rotate with journald instead:
#
#       /etc/systemd/journald.conf
#         SystemMaxUse=1G
#         SystemMaxFileSize=100M
#         MaxRetentionSec=30day
#
#       systemctl restart systemd-journald
#       journalctl -u alex-gateway --since "1 hour ago"
#
#    journald is the reason this file ships as an EXAMPLE: only install it if you truly write
#    log FILES.
#
# 2) Docker / compose: the application logs are the container's stdout, rotated by the Docker
#    daemon (`logging: driver: json-file, max-size: 10m, max-file: 5` in the compose example).
#    logrotate is not involved.
#
# 3) Files on disk (systemd unit with StandardOutput=append:/var/log/alex-gateway/gateway.log,
#    or a separate collector writing there): install this file as
#    /etc/logrotate.d/alex-gateway and keep the directory owned by the service account.
#
# copytruncate is deliberately NOT used. Truncating a file that an active process still holds
# open can silently drop the tail of the line being written, which is exactly the line an
# incident review needs. uvicorn (and Python's logging.FileHandler) does not reopen its files
# on SIGHUP either, so rotation with `create` must recycle the process. Because a Gateway
# restart interrupts in-flight SSE streams, the restart is deferred into a short maintenance
# window instead of running at rotation time.

/var/log/alex-gateway/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0640 alex alex
    dateext
    dateformat -%Y%m%d-%H%M%S
    sharedscripts
    postrotate
        # Recycle the service a few minutes after rotation so the new file is used by the new
        # process. `--on-active` keeps this out of the rotation critical path.
        systemd-run --on-active=2min --collect \
            --unit=alex-gateway-logrotate-restart \
            systemctl restart alex-gateway >/dev/null 2>&1 || true
    endscript
}

# Audit/retention note: the Gateway's tables (installations, activation-code digests, compute
# lease, idempotency records, audit events) are NOT rotated here. They are database data with
# backup requirements — see docs/gateway-deployment.md — and audit rows that must survive for
# the retention period your policy defines.
