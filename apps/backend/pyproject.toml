[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alex-llm-backend"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
  "sqlalchemy>=2.0.36,<3", "alembic>=1.14,<2",
  "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
  "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4",
  "fastembed>=0.8,<0.9", "pypdf>=6.18.1,<7",
  "python-docx>=1.2,<2", "python-multipart>=0.0.32,<1",
  "filelock>=3.20,<4", "huggingface-hub>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
