# Template: copy to .github/workflows/ci.yml when the GitHub credential has workflow scope.
name: Windows MVP checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up backend
        shell: pwsh
        run: ./scripts/setup-backend.ps1
      - name: Backend checks
        working-directory: apps/backend
        run: |
          .\.venv\Scripts\python.exe -m pytest -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m ruff check app tests alembic
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m alembic check
      - name: Frontend and end-to-end checks
        working-directory: apps/desktop
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:e2e
      - name: Native build
        working-directory: apps/desktop
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: alex-llm-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
