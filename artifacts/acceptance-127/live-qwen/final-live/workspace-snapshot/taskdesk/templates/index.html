<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TaskDesk</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 760px; color: #222; }
  h1 { margin-bottom: .2rem; }
  .bar { display: flex; gap: .5rem; margin: 1rem 0; }
  input, select, button { padding: .45rem .6rem; font-size: .95rem; }
  button { cursor: pointer; }
  #search { flex: 1; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border-bottom: 1px solid #ddd; padding: .5rem; text-align: left; }
  .status { padding: .15rem .5rem; border-radius: 10px; font-size: .8rem; }
  .status.todo { background: #eef; }
  .status.in_progress { background: #ffe9cc; }
  .status.done { background: #d8f5d8; }
  .muted { color: #888; font-size: .85rem; }
</style>
</head>
<body>
<h1>TaskDesk</h1>
<div class="bar">
  <form id="create-form">
    <input id="new-title" placeholder="Название задачи" required>
    <input id="new-desc" placeholder="Описание (необязательно)">
    <button type="submit">Добавить</button>
  </form>
</div>
<div class="bar">
  <input id="search" placeholder="Поиск (без учёта регистра)">
  <select id="filter">
    <option value="">Все статусы</option>
    {% for s in statuses %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
  </select>
</div>
<table>
  <thead><tr><th>#</th><th>Задача</th><th>Статус</th><th>Обновлено</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<p id="empty" class="muted" style="display:none">Нет задач.</p>
<script>
const rows = document.getElementById('rows');
const emptyMsg = document.getElementById('empty');
const searchEl = document.getElementById('search');
const filterEl = document.getElementById('filter');
const statuses = {{ statuses | tojson }};

async function api(url, opts) {
  const r = await fetch(url, opts);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.status);
  return data;
}

async function load() {
  const q = searchEl.value.trim();
  const st = filterEl.value;
  let url = '/api/tasks';
  const p = [];
  if (q) p.push('q=' + encodeURIComponent(q));
  if (st) p.push('status=' + encodeURIComponent(st));
  if (p.length) url += '?' + p.join('&');
  const { tasks } = await api(url);
  rows.innerHTML = '';
  emptyMsg.style.display = tasks.length ? 'none' : 'block';
  for (const t of tasks) rows.appendChild(renderRow(t));
}

function renderRow(t) {
  const tr = document.createElement('tr');
  const id = document.createElement('td'); id.textContent = t.id;
  const title = document.createElement('td');
  title.innerHTML = `<b></b><br><span class="muted"></span>`;
  title.querySelector('b').textContent = t.title;
  title.querySelector('span').textContent = t.description || '';
  const statusTd = document.createElement('td');
  const sel = document.createElement('select');
  for (const s of statuses) {
    const o = document.createElement('option');
    o.value = s; o.textContent = s;
    if (s === t.status) o.selected = true;
    sel.appendChild(o);
  }
  sel.onchange = async () => {
    await api(`/api/tasks/${t.id}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({status: sel.value})
    });
    load();
  };
  statusTd.appendChild(sel);
  const updated = document.createElement('td'); updated.textContent = t.updated_at;
  const actions = document.createElement('td');
  const del = document.createElement('button');
  del.textContent = 'Удалить';
  del.onclick = async () => { await api(`/api/tasks/${t.id}`, {method: 'DELETE'}); load(); };
  actions.appendChild(del);
  tr.append(id, title, statusTd, updated, actions);
  return tr;
}

document.getElementById('create-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = document.getElementById('new-title').value;
  const description = document.getElementById('new-desc').value;
  if (!title.trim()) return;
  await api('/api/tasks', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title, description})
  });
  document.getElementById('new-title').value = '';
  document.getElementById('new-desc').value = '';
  load();
});
searchEl.addEventListener('input', load);
filterEl.addEventListener('change', load);
load();
</script>
</body>
</html>
